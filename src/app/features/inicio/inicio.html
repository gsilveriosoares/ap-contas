<div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-4">
  <div>
    <p class="text-body-secondary mb-1">{{ saudacao }}!</p>
    <h1 class="mb-0">{{ hoje | date: 'MMMM' | titlecase }} de {{ hoje | date: 'yyyy' }}</h1>
  </div>
  <a routerLink="/contas/nova" class="btn btn-primary d-none d-lg-inline-flex align-items-center">
    <i class="bi bi-plus-lg me-1"></i>Nova conta
  </a>
</div>

<div class="row g-2 g-md-3 mb-4">
  @for (item of resumo; track item.rotulo) {
    <div class="col-6 col-xl-3">
      <div class="card h-100" [class.text-bg-primary]="item.destaque" [class.border-0]="item.destaque">
        <div class="card-body p-3">
          <div class="small" [class.text-body-secondary]="!item.destaque" [class.opacity-75]="item.destaque">{{ item.rotulo }}</div>
          <div class="valor-destaque fs-4">{{ item.valor | currency }}</div>
          <div class="small" [class.text-body-secondary]="!item.destaque" [class.opacity-75]="item.destaque">{{ item.nota }}</div>
        </div>
      </div>
    </div>
  }
</div>

<h2 class="h5 mb-3">Próximos vencimentos</h2>
<app-estado-vazio
  icone="bi-receipt"
  titulo="Nenhuma conta cadastrada"
  texto="Cadastre suas contas do mês para ver aqui o que vence primeiro e quanto falta pagar."
>
  <a routerLink="/contas/nova" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Cadastrar primeira conta</a>
</app-estado-vazio>
